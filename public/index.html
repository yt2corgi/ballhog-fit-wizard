<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Generate a Ballhog fit from real clothing across many shops">
<title>Ballhog Fit Wizard</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="sizesBtn" class="chip" type="button" hidden></button>
  <a id="brand" class="brand" href="./" hidden>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M12.5 10.5 16 7l3.5 3.5"/><path d="M9 18l7-6.2 7 6.2"/><path d="M5.5 25.5 16 16.8l10.5 8.7"/></svg>
    <span>Ballhog Fit Wizard</span>
  </a>
  <button id="savedBtn" class="chip right" type="button" hidden>Saved</button>
</header>

<main>
  <section id="idle" class="idle">
    <svg class="mark big" viewBox="0 0 32 32" aria-hidden="true"><path d="M12.5 10.5 16 7l3.5 3.5"/><path d="M9 18l7-6.2 7 6.2"/><path d="M5.5 25.5 16 16.8l10.5 8.7"/></svg>
    <h1>Ballhog Fit Wizard</h1>
    <button id="generate" class="cta" type="button">Generate a fit</button>
    <button id="underIdle" class="under" type="button" aria-pressed="false">Under $200</button>
  </section>

  <section id="fit" class="fit" hidden>
    <div class="fit-head">
      <h2 id="lane"></h2>
      <p id="note"></p>
    </div>
    <div id="stack" class="stack"></div>
  </section>
</main>

<div id="dock" class="dock" hidden>
  <div class="dock-in">
    <div class="total">
      <span>Total</span>
      <strong id="total"></strong>
    </div>
    <div class="dock-actions">
      <button id="under" class="under" type="button" aria-pressed="false">Under $200</button>
      <button id="save" class="round" type="button" aria-label="Save fit" aria-pressed="false"></button>
      <button id="share" class="round" type="button" aria-label="Copy share link"></button>
    </div>
    <button id="again" class="cta" type="button">Generate a fit</button>
  </div>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div id="handle" class="handle"><span></span></div>
  <div id="sheetBody" class="sheet-body"></div>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
